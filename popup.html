<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tab Workflows</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
  <script src="settings.js"></script>
  <script src="icons.js"></script>
  <script src="theme.js"></script>
</head>
<body>
  <header class="top">
    <div class="logo" id="logo"></div>
    <div class="top-text">
      <h1>Tab Workflows</h1>
      <div id="status" class="status"></div>
    </div>
    <div class="top-right" id="topRight"></div>
  </header>

  <div class="actions">
    <button id="newBtn" class="btn primary"></button>
    <button id="saveBtn" class="btn"></button>
    <button id="dividerBtn" class="btn" title="Insert a divider tab after this tab (Alt+Shift+D)"></button>
  </div>

  <section id="sheet" class="sheet hidden"></section>

  <div class="section-title">
    <span>Workflows</span>
    <span id="count" class="count"></span>
  </div>
  <ul id="list" class="list"></ul>
  <div id="empty" class="empty hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
